<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BJJ Cortex</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var cleanPath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        cleanPath.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        cleanPath.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
